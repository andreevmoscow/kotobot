name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Синтаксис Python
        run: python -m compileall -q bot.py config.py app

      - name: Синтаксис shell-скриптов
        run: |
          bash -n install.sh
          for f in deploy/*.sh; do bash -n "$f"; done
